<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b56"><title>DKP STRUCTURES</title><style>
:root{--navy:#102b56;--blue:#0754b5;--gold:#e7bd58;--ink:#15233a;--muted:#607087;--line:#d7e0ec;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:.04em}header a{color:white;text-decoration:none}.wrap{max-width:900px;margin:24px auto;padding:0 16px}
h1{font-size:clamp(25px,5vw,36px);margin:0 0 8px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #102b5610}
button{background:linear-gradient(120deg,var(--blue),var(--navy));color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}
input,select,textarea{width:100%;padding:12px;border:1px solid #bac8da;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border-radius:30px;background:#e9f1ff;color:#104b98;padding:4px 10px;font-size:12px;font-weight:750}
.item{padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.status{font-weight:800;color:#174e98}.error{color:#b42318}.success{color:#067647}
@media(max-width:560px){header{padding:14px}.wrap{margin:16px auto}.card{padding:14px}}
</style><style id="dkp-language-style">.dkp-language-select{max-width:190px;min-width:132px;padding:8px 10px;border:1px solid #c5a46d;border-radius:9px;background:#fff;color:#14263d;font:600 13px system-ui;z-index:10001}.goog-te-banner-frame,.goog-te-balloon-frame{display:none!important}body{top:0!important}#google_translate_element{display:none!important}@media(max-width:700px){.dkp-language-select{max-width:150px;min-width:120px;margin:6px 0}}</style></head><body><header><div class="brand">▥ DKP STRUCTURES</div><a href="/dashboard.html">Dashboard</a></header><main class="wrap"><h1>Complaints Centre</h1><p class="muted">This private space is exclusively for formal complaints. Your complaint is visible only to you and authorised management.</p><section class="card"><form id="form"><label for="category">Complaint category</label><select id="category" required><option value="">Choose a category</option><option value="payment">Payment or deposit issue</option><option value="account">Account or login problem</option><option value="contribution_record">Incorrect contribution record</option><option value="staff_conduct">Staff or management conduct</option><option value="other">Other complaint</option></select><label for="subject">Subject</label><input id="subject" maxlength="120" required><label for="details">Complaint details</label><textarea id="details" rows="6" maxlength="3000" minlength="20" required></textarea><p class="muted">Please do not include passwords, full card numbers or bank login credentials.</p><button>Submit Complaint</button><p id="msg" aria-live="polite"></p></form></section><h2>My complaint history</h2><section class="card" id="history">Loading…</section></main><script>
async function history(){const b=document.getElementById('history');try{const r=await fetch('/api/complaints');if(r.status===401){location.href='/index.html#account';return}const d=await r.json();b.innerHTML='';if(!d.complaints?.length){b.textContent='You have not submitted any complaints.';return}for(const c of d.complaints){const el=document.createElement('div');el.className='item';const h=document.createElement('strong');h.textContent=c.reference+' — '+c.subject;const p=document.createElement('p');p.textContent=c.status.replace('_',' ').toUpperCase();const note=document.createElement('p');note.textContent=c.admin_response||'';el.append(h,p,note);b.append(el)}}catch(e){b.textContent='Unable to load complaint history.'}}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('msg');m.textContent='Submitting…';try{const r=await fetch('/api/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:document.getElementById('category').value,subject:document.getElementById('subject').value,details:document.getElementById('details').value})});const d=await r.json();if(!r.ok)throw Error(d.error);m.className='success';m.textContent='Submitted. Reference: '+d.reference;document.getElementById('form').reset();history()}catch(x){m.className='error';m.textContent=x.message}};history();</script><script src="/language.js" defer></script></body></html>
