<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>DKP Structures · Community Management</title><style>
:root{--navy:#102b56;--blue:#0754b5;--gold:#e7bd58;--ink:#15233a;--muted:#607087;--line:#d7e0ec;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,Arial}header{background:var(--navy);color:#fff;padding:18px}.wrap{max-width:950px;margin:22px auto;padding:0 14px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}label{display:block;margin:10px 0 5px;font-weight:700}input,select,textarea,button{font:inherit;padding:11px;border:1px solid #bdcadd;border-radius:9px;max-width:100%}input,select,textarea{width:100%}button{background:var(--blue);color:#fff;border:0;font-weight:700;cursor:pointer}.muted{color:var(--muted)}.item{border-top:1px solid var(--line);padding:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{background:#e8f1ff;color:#124b94;padding:3px 9px;border-radius:20px;font-size:12px}.hidden{display:none}</style><style id="dkp-language-style">.dkp-language-select{max-width:190px;min-width:132px;padding:8px 10px;border:1px solid #c5a46d;border-radius:9px;background:#fff;color:#14263d;font:600 13px system-ui;z-index:10001}.goog-te-banner-frame,.goog-te-balloon-frame{display:none!important}body{top:0!important}#google_translate_element{display:none!important}@media(max-width:700px){.dkp-language-select{max-width:150px;min-width:120px;margin:6px 0}}</style></head><body><header><strong>▥ DKP STRUCTURES · ADMIN COMMUNITY MANAGEMENT</strong></header><main class="wrap"><p><a href="/admin.html">← Back to Admin Board</a></p><section class="card"><h1>Publish an announcement or newsletter</h1><form id="publish"><label>Title</label><input id="title" maxlength="160" required><label>Category</label><select id="category"><option>Official Announcement</option><option>Monthly Newsletter</option><option>Project Progress</option><option>Important Notice</option></select><label>Message</label><textarea id="body" rows="6" minlength="20" maxlength="10000" required></textarea><div class="row"><label><input type="checkbox" id="pinned"> Pin update</label><label><input type="checkbox" id="published" checked> Publish immediately</label></div><button>Save announcement</button><p id="publishMsg" class="muted"></p></form></section><section class="card"><h2>Published updates and drafts</h2><div id="announcements">Loading…</div></section><section class="card"><h2>Private complaints queue</h2><div id="complaints">Loading…</div></section><p id="message" role="status"></p></main><script>
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
async function load(){const me=await api('/api/me');if(me.user.role!=='admin')throw Error('Administrator access required.');const [a,c]=await Promise.all([api('/api/admin/announcements'),api('/api/admin/complaints')]);$('announcements').innerHTML=a.announcements.length?a.announcements.map(x=>'<article class="item"><strong>'+esc(x.title)+'</strong> <span class="pill">'+(x.is_published?'Published':'Draft')+'</span> '+(x.is_pinned?'📌 Pinned':'')+'<p class="muted">'+esc(x.category)+'</p><div class="row"><button onclick="setAnnouncement('+x.id+','+(!x.is_published)+','+x.is_pinned+')">'+(x.is_published?'Unpublish':'Publish')+'</button><button onclick="setAnnouncement('+x.id+','+x.is_published+','+(!x.is_pinned)+')">'+(x.is_pinned?'Unpin':'Pin')+'</button></div></article>').join(''):'No announcements yet.';$('complaints').innerHTML=c.complaints.length?c.complaints.map(x=>'<article class="item"><strong>'+esc(x.reference)+' · '+esc(x.subject)+'</strong><p>'+esc(x.full_name)+' · '+esc(x.supporter_id)+' · '+esc(x.email)+'</p><p>'+esc(x.category)+'</p><p>'+esc(x.details)+'</p><label>Status</label><select id="s'+x.id+'"><option value="received" '+(x.status==='received'?'selected':'')+'>Received</option><option value="under_review" '+(x.status==='under_review'?'selected':'')+'>Under review</option><option value="resolved" '+(x.status==='resolved'?'selected':'')+'>Resolved</option></select><label>Response to supporter</label><textarea id="r'+x.id+'" rows="2">'+esc(x.admin_response||'')+'</textarea><button onclick="saveComplaint('+x.id+')">Save complaint update</button></article>').join(''):'No complaints submitted.'}
async function setAnnouncement(id,published,pinned){try{await api('/api/admin/announcements/'+id,{method:'PATCH',body:JSON.stringify({published,pinned})});await load()}catch(e){$('message').textContent=e.message}}
async function saveComplaint(id){try{await api('/api/admin/complaints/'+id,{method:'PATCH',body:JSON.stringify({status:$('s'+id).value,response:$('r'+id).value})});await load()}catch(e){$('message').textContent=e.message}}
$('publish').onsubmit=async e=>{e.preventDefault();$('publishMsg').textContent='Saving…';try{await api('/api/admin/announcements',{method:'POST',body:JSON.stringify({title:$('title').value,category:$('category').value,body:$('body').value,pinned:$('pinned').checked,published:$('published').checked})});e.target.reset();$('publishMsg').textContent='Announcement saved.';await load()}catch(x){$('publishMsg').textContent=x.message}};
load().catch(e=>{$('message').textContent=e.message});
</script><script src="/language.js" defer></script></body></html>
