<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DKP STRUCTURES · Ranking Privacy</title><style>body{margin:0;background:#f3f6fb;color:#15233a;font:16px/1.5 system-ui,Arial}.wrap{max-width:650px;margin:35px auto;padding:16px}.card{background:white;border:1px solid #d7e0ec;border-radius:16px;padding:22px}input,button{font:inherit;padding:12px;border-radius:9px}input[type=text]{width:100%;border:1px solid #bdcadd;box-sizing:border-box}button{background:#0754b5;color:white;border:0;font-weight:700}label{display:block;margin:14px 0 6px}small{color:#607087}</style><style id="dkp-language-style">.dkp-language-select{max-width:190px;min-width:132px;padding:8px 10px;border:1px solid #c5a46d;border-radius:9px;background:#fff;color:#14263d;font:600 13px system-ui;z-index:10001}.goog-te-banner-frame,.goog-te-balloon-frame{display:none!important}body{top:0!important}#google_translate_element{display:none!important}@media(max-width:700px){.dkp-language-select{max-width:150px;min-width:120px;margin:6px 0}}</style></head><body><main class="wrap"><p><a href="/ranking.html">← Supporters Ranking</a></p><section class="card"><h1>Ranking privacy</h1><p>Public recognition is optional. Your verified contribution remains private unless you choose to appear on the public leaderboard.</p><form id="privacy"><label><input type="checkbox" id="show"> Show me in public rankings</label><label for="display">Public display name</label><input type="text" id="display" maxlength="80" placeholder="Choose the name visitors will see"><small>Do not use your email address or sensitive personal information.</small><p><button>Save privacy settings</button></p><p id="msg" role="status"></p></form></section></main><script>
(async()=>{try{const r=await fetch('/api/profile/ranking-privacy');if(r.status===401){location.href='/index.html#account';return}const d=await r.json();document.getElementById('show').checked=d.show_in_ranking===true;document.getElementById('display').value=d.display_name||''}catch(e){document.getElementById('msg').textContent='Unable to load settings.'}})();document.getElementById('privacy').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('msg');try{const r=await fetch('/api/profile/ranking-privacy',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({showInRanking:document.getElementById('show').checked,displayName:document.getElementById('display').value})});const d=await r.json();if(!r.ok)throw Error(d.error);msg.textContent='Privacy settings saved.'}catch(x){msg.textContent=x.message}};
</script><script src="/language.js" defer></script></body></html>
