<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3024"><title>DKP Structures | Reset password</title><style>body{margin:0;background:#f2f5f2;color:#17251e;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{background:white;border:1px solid #dce5df;border-radius:22px;padding:26px;width:min(100%,460px);box-sizing:border-box}label{display:block;font-weight:700;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dce5df;border-radius:12px;font:inherit}button{width:100%;padding:14px;background:#0b3024;color:white;border:0;border-radius:14px;font-weight:800;margin-top:18px}.muted{color:#718078}.msg{margin-top:14px}</style></head><body><main class="card"><h1>Reset your password</h1><p class="muted">Use the secure one-time link sent to you by DKP Structures support. The link expires after 30 minutes and can only be used once.</p><form id="form"><label>New password (12+ characters)</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><label>Confirm new password</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required><button type="submit">Set new password</button></form><p class="msg" id="msg" aria-live="polite"></p><p><a href="/">Return to DKP Structures</a></p></main><script>const token=new URLSearchParams(location.search).get("token")||"";document.getElementById("form").onsubmit=async e=>{e.preventDefault();const p=document.getElementById("password").value,c=document.getElementById("confirm").value,m=document.getElementById("msg");if(p!==c){m.textContent="The passwords do not match.";return}try{const r=await fetch("/api/password/reset",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,newPassword:p})});const d=await r.json();if(!r.ok)throw Error(d.error||"Password reset failed.");m.textContent=d.message;document.getElementById("form").hidden=true}catch(x){m.textContent=x.message}};</script></body></html>
