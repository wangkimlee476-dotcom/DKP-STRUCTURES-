<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3024"><title>DKP Structures | Password help</title><style>body{margin:0;background:#f2f5f2;color:#17251e;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:20px;box-sizing:border-box}.card{background:white;border:1px solid #dce5df;border-radius:22px;padding:26px;width:min(100%,460px);box-sizing:border-box}label{display:block;font-weight:700;margin:14px 0 5px}input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dce5df;border-radius:12px;font:inherit}button{width:100%;padding:14px;background:#0b3024;color:white;border:0;border-radius:14px;font-weight:800;margin-top:18px}.muted{color:#718078}.msg{margin-top:14px}</style></head><body><main class="card"><h1>Forgot your password?</h1><p class="muted">Enter the email address registered to your supporter account. Our support team will verify ownership before issuing a secure one-time password reset link.</p><form id="form"><label>Account email</label><input id="email" type="email" autocomplete="email" required><button type="submit">Request password recovery</button></form><p class="msg" id="msg" aria-live="polite"></p><p><a href="/#account">Return to login</a></p></main><script>document.getElementById("form").onsubmit=async e=>{e.preventDefault();const m=document.getElementById("msg");try{const r=await fetch("/api/password/forgot",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value})});const d=await r.json();if(!r.ok)throw Error(d.error||"Request failed");m.textContent=d.message}catch(x){m.textContent=x.message}};</script></body></html>
