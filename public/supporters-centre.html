<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b56"><title>DKP STRUCTURES</title><style>
:root{--navy:#102b56;--blue:#0754b5;--gold:#e7bd58;--ink:#15233a;--muted:#607087;--line:#d7e0ec;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:.04em}header a{color:white;text-decoration:none}.wrap{max-width:900px;margin:24px auto;padding:0 16px}
h1{font-size:clamp(25px,5vw,36px);margin:0 0 8px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #102b5610}
button{background:linear-gradient(120deg,var(--blue),var(--navy));color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}
input,select,textarea{width:100%;padding:12px;border:1px solid #bac8da;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border-radius:30px;background:#e9f1ff;color:#104b98;padding:4px 10px;font-size:12px;font-weight:750}
.item{padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.status{font-weight:800;color:#174e98}.error{color:#b42318}.success{color:#067647}
@media(max-width:560px){header{padding:14px}.wrap{margin:16px auto}.card{padding:14px}}
</style><style id="dkp-language-style">.dkp-language-select{max-width:190px;min-width:132px;padding:8px 10px;border:1px solid #c5a46d;border-radius:9px;background:#fff;color:#14263d;font:600 13px system-ui;z-index:10001}.goog-te-banner-frame,.goog-te-balloon-frame{display:none!important}body{top:0!important}#google_translate_element{display:none!important}@media(max-width:700px){.dkp-language-select{max-width:150px;min-width:120px;margin:6px 0}}</style></head><body><header><div class="brand">▥ DKP STRUCTURES</div><a href="/dashboard.html">Dashboard</a></header><main class="wrap"><h1>Supporters Centre</h1><p class="muted">Official announcements, newsletters and company progress updates from DKP STRUCTURES management.</p><div id="feed" class="card">Loading official updates…</div><p id="msg" class="muted"></p></main><script>
(async()=>{const box=document.getElementById('feed');try{const me=await fetch('/api/me');if(me.status===401){location.href='/index.html#account';return}const r=await fetch('/api/announcements');if(r.status===401){location.href='/index.html#account';return}const d=await r.json();box.innerHTML='';if(!d.announcements?.length){box.textContent='No official updates have been published yet.';return}for(const a of d.announcements){const el=document.createElement('article');el.className='item';const h=document.createElement('h2');h.textContent=a.title;const p=document.createElement('p');p.textContent=a.body;const meta=document.createElement('small');meta.className='muted';meta.textContent=(a.category||'Announcement')+' · '+new Date(a.published_at).toLocaleDateString();el.append(meta,h,p);if(a.is_pinned){const b=document.createElement('span');b.className='pill';b.textContent='Pinned';el.prepend(b)}box.append(el)}}catch(e){box.textContent='Unable to load updates right now. Please try again later.'}})();</script><script src="/language.js" defer></script></body></html>
