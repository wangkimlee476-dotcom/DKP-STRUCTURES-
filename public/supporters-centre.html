<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102b56"><title>DKP STRUCTURES</title><style>
:root{--navy:#102b56;--blue:#0754b5;--gold:#e7bd58;--ink:#15233a;--muted:#607087;--line:#d7e0ec;--bg:#f3f6fb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:900;letter-spacing:.04em}header a{color:white;text-decoration:none}.wrap{max-width:900px;margin:24px auto;padding:0 16px}
h1{font-size:clamp(25px,5vw,36px);margin:0 0 8px}.muted{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 5px 18px #102b5610}
button{background:linear-gradient(120deg,var(--blue),var(--navy));color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}
input,select,textarea{width:100%;padding:12px;border:1px solid #bac8da;border-radius:9px;font:inherit;background:#fff;color:var(--ink)}
label{display:block;font-weight:700;margin:12px 0 6px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border-radius:30px;background:#e9f1ff;color:#104b98;padding:4px 10px;font-size:12px;font-weight:750}
.item{padding:15px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.status{font-weight:800;color:#174e98}.error{color:#b42318}.success{color:#067647}
@media(max-width:560px){header{padding:14px}.wrap{margin:16px auto}.card{padding:14px}}
 .feed-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.post-body{white-space:normal}.comment-list{border-top:1px solid var(--line);margin-top:16px}.comment{padding:10px 12px;background:#f6f8fc;border-radius:10px;margin:8px 0}.comment p{margin:5px 0 0;white-space:pre-wrap}.comment small{display:block}.comment-form{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}.comment-form button{margin-left:auto}.comment-form button:disabled{opacity:.6;cursor:wait}@media(min-width:700px){.wrap{max-width:850px}} </style><style id="dkp-language-style">.dkp-language-select{max-width:190px;min-width:132px;padding:8px 10px;border:1px solid #c5a46d;border-radius:9px;background:#fff;color:#14263d;font:600 13px system-ui;z-index:10001}.goog-te-banner-frame,.goog-te-balloon-frame{display:none!important}body{top:0!important}#google_translate_element{display:none!important}@media(max-width:700px){.dkp-language-select{max-width:150px;min-width:120px;margin:6px 0}}</style></head><body><header><div class="brand">▥ DKP STRUCTURES</div><a href="/dashboard.html">Dashboard</a></header><main class="wrap"><h1>Supporters Centre</h1><p class="muted">Official announcements, newsletters and company progress updates from DKP STRUCTURES management.</p><div id="feed" class="card">Loading official updates…</div><p id="msg" class="muted"></p></main><script>
(async()=>{const box=document.getElementById('feed'),msg=document.getElementById('msg');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,opt={}){const r=await fetch(url,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...opt});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}try{const me=await api('/api/me');const d=await api('/api/announcements');box.innerHTML='<div class="feed-head"><strong>Community updates</strong><span class="muted">'+d.announcements.length+' updates</span></div>';if(!d.announcements?.length){box.insertAdjacentHTML('beforeend','<p class="muted">No official updates have been published yet.</p>');return}for(const a of d.announcements){const el=document.createElement('article');el.className='item';const comments=await api('/api/announcements/'+a.id+'/comments');el.innerHTML='<div class="row"><span class="pill">'+esc(a.category||'Announcement')+'</span>'+(a.is_pinned?'<span class="pill">📌 Pinned</span>':'')+'<small class="muted">'+new Date(a.published_at).toLocaleString()+'</small></div><h2>'+esc(a.title)+'</h2><p class="post-body">'+esc(a.body).replace(/\n/g,'<br>')+'</p><div class="comment-list">'+comments.comments.map(c=>'<div class="comment"><strong>'+esc(c.display_name)+(c.role==='admin'?' · DKP Management':'')+'</strong><small class="muted">'+new Date(c.created_at).toLocaleString()+'</small><p>'+esc(c.body)+'</p></div>').join('')+'</div><form class="comment-form" data-id="'+a.id+'"><label>Share your opinion</label><textarea name="body" rows="2" minlength="2" maxlength="2000" placeholder="Write a respectful comment…" required></textarea><div class="row"><small class="muted">'+comments.comments.length+' comments</small><button type="submit">Post comment</button></div><p class="muted form-msg" aria-live="polite"></p></form>';box.append(el)}box.querySelectorAll('.comment-form').forEach(form=>form.addEventListener('submit',async e=>{e.preventDefault();const b=form.querySelector('button'),m=form.querySelector('.form-msg');b.disabled=true;m.textContent='Posting…';try{await api('/api/announcements/'+form.dataset.id+'/comments',{method:'POST',body:JSON.stringify({body:form.body.value})});msg.textContent='Your comment has been posted.';await location.reload()}catch(x){m.textContent=x.message;b.disabled=false}}))}catch(e){box.textContent=e.message.includes('sign in')?'Please sign in to view the supporters community.': 'Unable to load the community: '+e.message}})();
</script></script><script src="/language.js" defer></script></body></html>
