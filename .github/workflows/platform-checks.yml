name: Platform checks

on:
  pull_request:
    branches: [main, feature/postgresql-migration, feature/cloudflare-workers]
  push:
    branches:
      - main
      - release/platform-polish-security
      - ci/deploy-readiness-checks
      - feature/cloudflare-workers
      - fix/smartsupp-support-payment-flow

jobs:
  syntax:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server and browser JavaScript syntax
        run: npm run check
      - name: Validate Cloudflare Worker bundle
        if: github.ref == 'refs/heads/feature/cloudflare-workers' || github.head_ref == 'feature/cloudflare-workers'
        run: npx --yes wrangler@4 deploy --dry-run

      - name: Deploy production Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/cloudflare-workers' && env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
