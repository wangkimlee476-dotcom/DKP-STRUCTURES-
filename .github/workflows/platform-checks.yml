name: Platform checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - release/platform-polish-security
      - ci/deploy-readiness-checks

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server and browser JavaScript syntax
        run: npm run check
