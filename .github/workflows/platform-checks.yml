name: Platform checks

on:
  pull_request:
    branches: [main, feature/postgresql-migration]
  push:
    branches:
      - main
      - release/platform-polish-security
      - ci/deploy-readiness-checks
      - feature/cloudflare-workers

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check server and browser JavaScript syntax
        run: npm run check
      - name: Validate Cloudflare Worker bundle
        if: github.ref == 'refs/heads/feature/cloudflare-workers'
        run: npx --yes wrangler@4 deploy --dry-run
