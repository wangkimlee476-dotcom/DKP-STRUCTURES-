name: DKP production deployment and smoke test

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Type DEPLOY-DKP-PRODUCTION to authorize deployment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: dkp-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/rebuild/professional-functional' && inputs.confirm_production_deploy == 'DEPLOY-DKP-PRODUCTION'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out validated rebuild branch
        uses: actions/checkout@v4
        with:
          ref: rebuild/professional-functional

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Re-run platform checks
        run: bun run check

      - name: Verify deployment credentials are configured
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN repository/environment secret" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID repository/environment secret" && exit 1)
          test -n "$SESSION_SECRET" || (echo "Missing SESSION_SECRET production secret" && exit 1)
          test "${#SESSION_SECRET}" -ge 32 || (echo "SESSION_SECRET must contain at least 32 characters" && exit 1)

      - name: Configure production session secret
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
        run: printf '%s' "$SESSION_SECRET" | bunx wrangler@4.160.0 secret put SESSION_SECRET

      - name: Deploy Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler@4.160.0 deploy

      - name: Verify deployed public pages and production API
        env:
          SITE_URL: https://dkp-structures.dkpstructures.workers.dev
        run: |
          set -eu
          for path in / /dashboard.html /admin.html /forgot-password.html /reset-password.html; do
            code="$(curl --location --silent --show-error --output /dev/null --write-out '%{http_code}' "$SITE_URL$path")"
            case "$code" in 200) echo "$path -> $code" ;; *) echo "$path returned HTTP $code"; exit 1 ;; esac
          done
          health="$(curl --silent --show-error --fail "$SITE_URL/api/health")"
          echo "$health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"schema":"ready"'
